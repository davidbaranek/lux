[workspace]
resolver = "3"
members = ["crates/lux-agent", "crates/lux-core", "crates/lux-ffi", "crates/lux-intelligence", "crates/lux-matrix", "crates/lux-store", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
lux-agent = { path = "crates/lux-agent" }
lux-core = { path = "crates/lux-core" }
lux-intelligence = { path = "crates/lux-intelligence" }
lux-store = { path = "crates/lux-store" }
lux-matrix = { path = "crates/lux-matrix" }
uniffi = { version = "0.32.1", default-features = false, features = ["cargo-metadata", "tokio"] }
uniffi_bindgen = { version = "0.32.1", default-features = false, features = ["cargo-metadata"] }
thiserror = "2"
# the version the sdk uses: one libsqlite3-sys in the graph (see lux-store).
rusqlite = { version = "0.40.2", default-features = false }
# for lux-store's tests: the sdk's own stores, opened by the SQLCipher the library links.
matrix-sdk-sqlite = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d", default-features = false }
jiff = "0.2"
linkify = "0.10"
# the account (lux-matrix): the sdk, at the commit of the release the apps used before (26.10.27),
# so it opens the stores the apps' accounts already have.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
# the sdk's store cipher: whether a key opens a store, before the sdk opens it (lux-matrix).
matrix-sdk-store-encryption = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d" }
matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d", default-features = false }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d", default-features = false, features = ["rustls-aws-lc-rs"] }
matrix-sdk-test = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "14a0ada4fcb3a93f47248b6abefbd04ceaf71e5d" }
# a message's HTML (lux-core): ruma's own parser and the Matrix subset's sanitizer, at the ruma
# commit the sdk uses, so one ruma-html and one html5ever are in the graph.
ruma-html = { git = "https://github.com/ruma/ruma", rev = "e03080c0790ba7b24ea37f9fd11794678cc975b0", features = ["matrix"] }
# a mention's matrix.to address (lux-core), read and written as the sdk's ruma does.
ruma-common = { git = "https://github.com/ruma/ruma", rev = "e03080c0790ba7b24ea37f9fd11794678cc975b0" }
# the sdk's observables (the sync's state).
eyeball = "0.8.8"
eyeball-im = "0.9.1"
futures-core = "0.3"
# an attachment's type, as the sdk takes it.
mime = { version = "0.3.17", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# the bridges' provisioning api (lux-matrix): the sdk's own http client and its version.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sha2 = "0.11"
uuid = { version = "1", default-features = false, features = ["v4"] }
tokio = { version = "1.54", default-features = false, features = ["sync", "rt", "macros"] }
# tasks that end with their owner (lux-matrix's `task`); the version the sdk uses.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# the core's log, handed to the app (lux-ffi).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
tempfile = "3"
zeroize = "1.9"
# the stores' key (lux-matrix).
getrandom = "0.3"
# photo search's query words as the model's token ids (lux-ffi): Hugging Face's own tokenizer, in
# pure Rust (its regexes by fancy-regex, not the C Oniguruma).
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

# the sdk's own patches: a git dependency does not bring its workspace's.
[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
# a `let _ =` of a value with a meaningful drop (a lock, a task's handle) ends it at once.
let_underscore_drop = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# a dropped `Result` says nothing of what it lost: handled, or `lux_core::gone::OtherEndGone`.
let_underscore_must_use = "deny"
# nor any other `let _ =` without its type: what is dropped is said.
let_underscore_untyped = "deny"
# `tokio::spawn` (clippy.toml): a task has an owner that ends it.
disallowed_methods = "deny"

[profile.dev]
debug = 0

# while working (`cargo xtask apple --dev`): the dependencies (the sdk) fully optimized and
# built once, the workspace's own crates lightly optimized and incremental, no LTO, so a change
# in the core relinks in seconds. Not lower than 1: the sdk at opt-level 0 crashes on device.
[profile.dev-apple]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev-apple.package."*"]
opt-level = 3

# quick optimized builds while working: thin LTO keeps relinking the sdk short.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = "debuginfo"

# what the apps ship (`cargo xtask apple`): as the sdk's own distributed libraries, small code
# (`s` measured about a third smaller than `release`) and whole-program LTO.
[profile.distribution]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# stripped proc-macro dylibs fail to load on macOS 27 (the sdk notes it too).
[profile.distribution.build-override]
strip = "none"
