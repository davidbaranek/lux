[package]
name = "lux-agent"
description = "What agents may do with the account, on the Mac: the tools, the sessions the user grants, the chats kept from them, and the CLI and MCP that reach them over a socket."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# a session's match code.
getrandom.workspace = true
# times as RFC 3339, as the tools give and take them.
jiff.workspace = true
# the MCP front (`lux mcp`): the official SDK, its stdio server.
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
# a tool's arguments and answer as JSON Schema, for MCP and `lux schema`.
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# the socket between the app and the `lux` binary.
tokio = { workspace = true, features = ["io-std", "io-util", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
