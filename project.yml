# xcodegen generate  ->  Lux.xcodeproj (committed: Xcode Cloud reads it from the repository)
name: Lux
# the identifiers (bundle id, app group, push gateway, OAuth client) and the team id.
configFiles:
  Debug: Config/Lux.xcconfig
  Release: Config/Lux.xcconfig
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  LuxKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Lux
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # the SDK ships arm64 slices only (device, Apple-silicon simulator and Mac).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
# Each target's Info.plist and .entitlements are generated by xcodegen from the `info:` and
# `entitlements:` properties below: edit them here, never in those files.
targets:
  Lux-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      # notes beside the shared assets are not resources.
      - path: Apps/Shared
        excludes: ["**/*.md"]
    entitlements:
      path: Apps/iOS/Lux.entitlements
      properties:
        # development: Xcode's export for the App Store and its testers makes it production.
        aps-environment: development
        # the store, shared with the notification extension.
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
        # the app's default group (its application identifier), named, so the extension reads the
        # account's items there.
        keychain-access-groups: [$(AppIdentifierPrefix)$(LUX_BUNDLE_ID)]
        # a message's notification as from a person (INSendMessageIntent).
        com.apple.developer.usernotifications.communication: true
    dependencies:
      - package: LuxKit
        product: LuxCore
      - target: Lux-iOS-Notifications
      - target: Lux-iOS-Share
      - target: Lux-iOS-Assets
    settings:
      base:
        PRODUCT_NAME: Lux
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
    # merged with the generated Info.plist: the background tasks that keep uploads going, refresh
    # the chats (an app refresh task needs the background fetch mode) and read photos at night.
    info:
      path: Apps/iOS/Info.plist
      properties:
        # the explicit plist would otherwise keep xcodegen's 1.0 / 1 over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # this build's identity, read by `AppIdentity` (Config/Lux.xcconfig).
        LuxBundleID: $(LUX_BUNDLE_ID)
        LuxAppGroup: $(LUX_APP_GROUP)
        LuxPushGateway: $(LUX_PUSH_GATEWAY)
        LuxOAuthClientURI: $(LUX_OAUTH_CLIENT_URI)
        BGTaskSchedulerPermittedIdentifiers: [$(LUX_BUNDLE_ID).uploads, $(LUX_BUNDLE_ID).refresh, $(LUX_BUNDLE_ID).reading]
        # files go on sending in a continued processing task when the user leaves the app, and
        # search reads what it has left in a processing task while the iPhone charges.
        UIBackgroundModes: [fetch, processing]
        # the chats the user writes in, donated as conversations: the share sheet suggests them;
        # the open chat, continued on the account's other devices (Handoff, `ChatActivity`).
        NSUserActivityTypes: [INSendMessageIntent, $(LUX_BUNDLE_ID).chat]
        # photo search's model, an Apple-hosted asset pack (Lux-iOS-Assets downloads it).
        BAAppGroupID: $(LUX_APP_GROUP)
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        # export compliance: only standard encryption (Matrix's Olm and Megolm, TLS) in a
        # mass-market messenger, exempt; App Store Connect asks nothing for each build (as Element X).
        ITSAppUsesNonExemptEncryption: false
  # downloads photo search's model (an Apple-hosted asset pack) when the system schedules it.
  Lux-iOS-Assets:
    type: extensionkit-extension
    platform: iOS
    sources: [Apps/AssetDownloader]
    info:
      path: Apps/AssetDownloader/Info-iOS.plist
      properties:
        CFBundleDisplayName: Lux Downloads
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    entitlements:
      path: Apps/AssetDownloader/AssetDownloader-iOS.entitlements
      properties:
        # Background Assets coordinates the app and its downloader through their group.
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: LuxAssets
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).assets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # sends what another app shares to one chat, from the account's store shared with the app.
  Lux-iOS-Share:
    type: app-extension
    platform: iOS
    sources:
      - Apps/ShareExtension
      # the app's picture circle and its conversation donation.
      - Apps/iOS/Components/AvatarView.swift
      - Apps/iOS/Components/ConversationDonation.swift
    info:
      path: Apps/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Lux
        # the same version as the app: App Store Connect refuses an extension that differs.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # the app's identity, not the extension's: the same Keychain items and App Group.
        LuxBundleID: $(LUX_BUNDLE_ID)
        LuxAppGroup: $(LUX_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareNavigationController
          NSExtensionAttributes:
            # a chat the system suggests (a donated conversation) opens the extension chosen.
            IntentsSupported: [INSendMessageIntent]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Apps/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(LUX_BUNDLE_ID)]
    dependencies:
      - package: LuxKit
        product: LuxCore
    settings:
      base:
        PRODUCT_NAME: LuxShare
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # decrypts a pushed message on the device and shows it (the server pushes only its id).
  Lux-iOS-Notifications:
    type: app-extension
    platform: iOS
    sources: [Apps/NotificationService]
    # written by XcodeGen from these properties.
    info:
      path: Apps/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Lux Notifications
        # the same version as the app: App Store Connect refuses an extension that differs.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # the app's identity, not the extension's: the same Keychain items and App Group.
        LuxBundleID: $(LUX_BUNDLE_ID)
        LuxAppGroup: $(LUX_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        # the extension words a message as from a person (communication notifications).
        NSUserActivityTypes: [INSendMessageIntent]
        # NOTIFICATION FILTERING, 1 of 2: tells the code the entitlement below is there (iOS
        # cannot read an app's entitlements). Uncomment both once Apple grants it.
        # LuxFiltersNotifications: true
    entitlements:
      path: Apps/NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(LUX_BUNDLE_ID)]
        # NOTIFICATION FILTERING, 2 of 2: lets the extension drop a push it should not show (a
        # message the push rules filter out on the device, or one deleted since) instead of
        # showing "New message". Apple grants it on request (developer.apple.com/contact/request/
        # notification-service), for the extension's App ID; until then, keep both commented: a
        # build that claims it without the grant fails to sign.
        # com.apple.developer.usernotifications.filtering: true
    dependencies:
      - package: LuxKit
        product: LuxCore
    settings:
      base:
        PRODUCT_NAME: LuxNotifications
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).notifications
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  Lux-Mac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
      # notes beside the shared assets are not resources.
      - path: Apps/Shared
        excludes: ["**/*.md"]
    entitlements:
      path: Apps/Mac/Lux.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # files the user picks in the open panel (attachments).
        com.apple.security.files.user-selected.read-only: true
        # shared with the downloader of photo search's model (Lux-Mac-Assets).
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
    # merged with the generated Info.plist.
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # this build's identity, read by `AppIdentity` (Config/Lux.xcconfig).
        LuxBundleID: $(LUX_BUNDLE_ID)
        LuxPushGateway: $(LUX_PUSH_GATEWAY)
        LuxOAuthClientURI: $(LUX_OAUTH_CLIENT_URI)
        # the open chat, continued on the account's other devices (Handoff, `ChatActivity`).
        NSUserActivityTypes: [$(LUX_BUNDLE_ID).chat]
        # photo search's model, an Apple-hosted asset pack (Lux-Mac-Assets downloads it).
        BAAppGroupID: $(LUX_APP_GROUP)
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        # export compliance: only standard encryption (Matrix's Olm and Megolm, TLS) in a
        # mass-market messenger, exempt; App Store Connect asks nothing for each build (as Element X).
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: LuxKit
        product: LuxCore
      - target: Lux-Mac-Assets
    settings:
      base:
        PRODUCT_NAME: Lux
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID)
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        # a stable identity keeps the Keychain's access list valid across builds (ad-hoc signing
        # changes the app's identity with every build, and macOS asks for access again).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
  # downloads photo search's model on the Mac, as Lux-iOS-Assets does on the iPhone.
  Lux-Mac-Assets:
    type: extensionkit-extension
    platform: macOS
    sources: [Apps/AssetDownloader]
    info:
      path: Apps/AssetDownloader/Info-Mac.plist
      properties:
        CFBundleDisplayName: Lux Downloads
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    entitlements:
      path: Apps/AssetDownloader/AssetDownloader-Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(LUX_APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: LuxAssets
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).assets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  Lux-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/UITests]
    dependencies:
      - target: Lux-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Lux-iOS
  # the view layer's tests, inside the app (its test host, `@testable import Lux`), each over a
  # demo session of its own: a view controller's view loaded, what its list shows read
  # (Apps/ViewTests).
  Lux-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/ViewTests/iOS, Apps/ViewTests/Shared]
    dependencies:
      - target: Lux-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        # the app's product is Lux, not its target's name (XcodeGen's default host).
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lux.app/Lux
        # closes the host app's own demo session as the bundle ends (Apps/ViewTests/Shared).
        INFOPLIST_KEY_NSPrincipalClass: HostSessionCloser
  Lux-Mac-Tests:
    type: bundle.unit-test
    platform: macOS
    sources: [Apps/ViewTests/Mac, Apps/ViewTests/Shared]
    dependencies:
      - target: Lux-Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUX_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lux.app/Contents/MacOS/Lux
        # closes the host app's own demo session as the bundle ends (Apps/ViewTests/Shared).
        INFOPLIST_KEY_NSPrincipalClass: HostSessionCloser
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
schemes:
  Lux-iOS:
    build:
      targets: { Lux-iOS: all }
    test:
      targets: [Lux-iOS-UITests]
      config: Release
  Lux-Mac:
    build:
      targets: { Lux-Mac: all }
  # the view layer's tests, in Debug (the app built for `@testable import`). The app hosting them
  # runs the demo (`-LuxDemo`): it never opens the account saved on this machine.
  Lux-iOS-Tests:
    build:
      targets: { Lux-iOS-Tests: [test] }
    test:
      config: Debug
      targets: [Lux-iOS-Tests]
      commandLineArguments: { "-LuxDemo": true }
  Lux-Mac-Tests:
    build:
      targets: { Lux-Mac-Tests: [test] }
    test:
      config: Debug
      targets: [Lux-Mac-Tests]
      commandLineArguments: { "-LuxDemo": true }
