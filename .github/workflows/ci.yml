# Every pull request into dev and main, and every push to them: the Rust core (formatting, lints,
# tests), Swift that forces or swallows an error (scripts/check-swift-errors.sh), the shared Swift
# package's tests (also under Thread Sanitizer), both apps built and the Mac app's view tests
# (Apps/ViewTests) run. Branch protection requires
# `check`, which passes only when every one of those jobs did. What needs a simulator runs only by
# hand (the Actions tab), before a TestFlight build, and `check` does not wait for it: the iPhone
# app's view tests and its smoke test (Apps/UITests/SmokeTests.swift).
#
# The apps link the core's XCFramework (Vendor/, `cargo xtask apple`). `sdk` builds its simulator
# and Mac slices once (the dev profile: optimized SDK, light core) and caches it by the core's
# sources, so a change outside core/ reuses it; the other jobs restore that cache.
#
# The macOS jobs run on GitHub's Xcode 27 image (`xcode-27`): the apps use the 27 SDKs, which the
# macos-26 image does not have. A new major Xcode means a new label here.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: xcode-27
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: host
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Swift that forces or silently swallows an error. A grep, so it needs no Xcode or core build.
  swift-errors:
    runs-on: macos-latest
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No try!, as!, try? or fatalError
        run: sh scripts/check-swift-errors.sh

  # the core as the apps link it: Vendor/LuxFFI.xcframework and Vendor/LuxBindings.
  sdk:
    runs-on: xcode-27
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - id: key
        name: Vendor's cache key
        run: echo "key=vendor-$(sh .github/actions/xcode/version.sh)-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/rust-toolchain.toml', 'core/crates/**', 'core/xtask/**') }}" >> "$GITHUB_OUTPUT"
      - id: vendor
        uses: actions/cache@v4
        with:
          path: Vendor
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Install the toolchain
        if: steps.vendor.outputs.cache-hit != 'true'
        working-directory: core
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.vendor.outputs.cache-hit != 'true'
        with:
          workspaces: core
          key: apple
      - name: Build the core for the simulator and the Mac
        if: steps.vendor.outputs.cache-hit != 'true'
        run: sh scripts/setup-sdk.sh --dev --only ios-simulator --only macos
      - name: Save Vendor
        if: steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: ${{ steps.key.outputs.key }}

  # LuxCore's tests, then again under Thread Sanitizer (data races in the shared model).
  swift:
    needs: sdk
    runs-on: xcode-27
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: ${{ needs.sdk.outputs.key }}
          fail-on-cache-miss: true
      - name: Test
        run: swift test
      # TSan names a race's functions with LLVM's symbolizer, not atos: it symbolizes a report before
      # it matches a suppression, and two reports at once, each waiting seconds on a cold atos, held
      # TSan's locks and stopped every thread of the test process for 15-25 s. llvm-symbolizer is one
      # process that answers at once, and it reads non-exported symbols (a fileprivate function, such
      # as the one suppressed), which TSan's in-process dladdr does not. The runner image has Homebrew's
      # llvm@20. Its names are mangled; swift-demangle makes the report Swift (pipefail keeps the exit).
      - name: The symbolizer is there
        run: test -x /opt/homebrew/opt/llvm@20/bin/llvm-symbolizer
      - name: Test under Thread Sanitizer
        shell: bash
        run: swift test --sanitize=thread --scratch-path .build/tsan 2>&1 | xcrun swift-demangle
        env:
          # one false race, on the runner's macOS, is suppressed (Tests/tsan-suppressions.txt).
          TSAN_OPTIONS: >-
            halt_on_error=1 suppressions=${{ github.workspace }}/Tests/tsan-suppressions.txt
            external_symbolizer_path=/opt/homebrew/opt/llvm@20/bin/llvm-symbolizer
      # a test process that dies leaves its crash report there, not in the log.
      - name: Keep the crash reports
        if: failure()
        run: |
          mkdir -p .build/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips .build/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: swift-crashes
          path: .build/crashes

  apps:
    needs: sdk
    runs-on: xcode-27
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: ${{ needs.sdk.outputs.key }}
          fail-on-cache-miss: true
      # each build's log is checked for warnings too: not every warning is promoted to an error
      # (scripts/check-build-warnings.sh).
      - name: Build the iPhone app
        run: |
          set -o pipefail; mkdir -p build
          xcodebuild build -scheme Lux-iOS -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ios.log
          sh scripts/check-build-warnings.sh build/ios.log
      # universal, as Xcode Cloud archives it: the package (LuxCore) is compiled for x86_64 too,
      # where some types (Float16) do not exist; the app itself links arm64 only (project.yml).
      # Ad-hoc signed: no team, no profile, no entitlements (they need the team's).
      - name: Build the Mac app
        run: |
          set -o pipefail; mkdir -p build
          xcodebuild build -scheme Lux-Mac -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -quiet \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= 2>&1 | tee build/mac.log
          sh scripts/check-build-warnings.sh build/mac.log
      # the view tests (Apps/ViewTests), in the apps they test, each over a demo session of its
      # own: no window, nothing drawn or animated, so the runner's missing GPU does not slow them,
      # and they wait on the models' announcements, never a clock. Ad-hoc signed, as the builds
      # above: no team, no profile (the Mac also without its entitlements).
      - name: Test the Mac app's views
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test -scheme Lux-Mac-Tests -destination 'platform=macOS,arch=arm64' -only-testing:Lux-Mac-Tests \
            -derivedDataPath build/DerivedData -resultBundlePath build/MacViews.xcresult -skipPackagePluginValidation \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= 2>&1 | tee build/mac-views.log
          sh scripts/check-build-warnings.sh build/mac-views.log
      # the iPhone's view tests only by hand: on the runner the simulator shares three cores with
      # the app hosting the tests, which fills its own demo of 2 000 chats meanwhile, and a test's
      # session took over a minute to close (run 44338775771). They come back to every pull
      # request once the host does no such work.
      # the newest "iPhone NN Pro", as the smoke test picks it.
      - name: Pick an iPhone simulator
        if: github.event_name == 'workflow_dispatch'
        id: simulator
        run: |
          id=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | sort_by(.name) | last | .udid')
          test -n "$id" && test "$id" != null
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Test the iPhone app's views
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test -scheme Lux-iOS-Tests -destination 'id=${{ steps.simulator.outputs.id }}' -only-testing:Lux-iOS-Tests \
            -derivedDataPath build/DerivedData -resultBundlePath build/iOSViews.xcresult -skipPackagePluginValidation \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= 2>&1 | tee build/ios-views.log
          sh scripts/check-build-warnings.sh build/ios-views.log
      - name: Keep the view tests' results and any crash report
        if: failure()
        run: |
          mkdir -p build/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips build/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: view-tests
          path: |
            build/MacViews.xcresult
            build/iOSViews.xcresult
            build/crashes

  # the demo account walked through on a simulator: fails on a crash or a 10 s hang. Only by hand
  # (the Actions tab), before a TestFlight build.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: sdk
    runs-on: xcode-27
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: ${{ needs.sdk.outputs.key }}
          fail-on-cache-miss: true
      # the newest "iPhone NN Pro": an ordinary phone (not a foldable or a Max), the same each run.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | sort_by(.name) | last | .udid')
          test -n "$id" && test "$id" != null
          xcrun simctl list devices | grep "$id"
          xcrun simctl boot "$id" || true
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # the runner's VM has no GPU: the glass and the search's morph render in software there and
      # hold the app's main thread for seconds after a tap. The smoke test checks for crashes and
      # hangs, not rendering, so the simulator runs with Reduce Motion and Reduce Transparency,
      # as a person may set them (the app honours both).
      - name: Reduce Motion and Transparency on the simulator
        run: |
          id='${{ steps.simulator.outputs.id }}'
          xcrun simctl spawn "$id" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          xcrun simctl spawn "$id" defaults write com.apple.Accessibility EnhancedBackgroundContrastEnabled -bool YES
          xcrun simctl spawn "$id" notifyutil -p com.apple.accessibility.reduce.motion.status
          xcrun simctl spawn "$id" notifyutil -p com.apple.accessibility.enhanced.background.contrast.status
      # signed to run locally (ad-hoc): the simulator then gets the app's entitlements (its
      # App Group), as on a device.
      - name: Smoke test
        run: >
          xcodebuild test -scheme Lux-iOS -destination 'id=${{ steps.simulator.outputs.id }}'
          -only-testing:Lux-iOS-UITests/SmokeTests -derivedDataPath build/DerivedData
          -resultBundlePath build/Smoke.xcresult -skipPackagePluginValidation
          -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      - name: Keep the result and any crash report
        if: failure()
        run: |
          mkdir -p build/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips build/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke
          path: |
            build/Smoke.xcresult
            build/crashes

  # the one check branch protection requires.
  check:
    if: always()
    needs: [core, swift-errors, sdk, swift, apps]
    runs-on: ubuntu-latest
    # a hung build or simulator ends here, not after the default six hours on the runner.
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
